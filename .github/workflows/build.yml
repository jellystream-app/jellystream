name: Build

# Ein Befehl, ein vollständiges Release für alle Plattformen:
#
#   npm version minor && git push --follow-tags
#
# Actions baut daraufhin Windows und Linux und hängt alle Pakete an
# ein Release — samt latest.yml, ohne die der Updater nichts findet.
#
# Wer lieber im Browser arbeitet: ein dort veröffentlichtes Release
# löst denselben Ablauf aus (release/published). Ein über die
# Weboberfläche angelegtes Release erzeugt KEIN push-Ereignis, deshalb
# sind beide Auslöser nötig.
#
# Die Testsuite läuft hier bewusst NICHT: sie fährt echte
# Electron-Fenster hoch, misst Layout und Zeitverhalten und ist auf
# CI-Läufern zu heikel — ein roter Lauf sagte dann mehr über den
# Läufer als über den Code. Getestet wird vor dem Tag, lokal mit
# `npm test`.

on:
  release:
    types: [published]

  push:
    tags:
      # Beide Schreibweisen: bisherige Tags sind groß (V2.7.2),
      # `npm version` schreibt klein (v2.8.0).
      - "v*"
      - "V*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag, an dessen Release die Pakete gehängt werden (leer = nur Artefakte)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Ein fehlgeschlagenes Ziel soll das andere nicht abwürgen:
      # so sieht man, ob nur eine Plattform klemmt oder der Code.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build -- --linux AppImage deb
            artifact: linux
          - os: windows-latest
            build_cmd: npm run build -- --win nsis
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          # Beim manuellen Lauf mit Tag genau dessen Stand bauen,
          # sonst den auslösenden Commit.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # electron-builder packt die Electron-Binärdatei in das Paket.
      # Sie kommt per postinstall; der Schritt kann aber still
      # scheitern (Netz, Spiegelserver), und dann bricht erst der
      # Build ab. Deshalb vorher prüfen und notfalls nachholen.
      - name: Electron-Binärdatei sicherstellen
        shell: bash
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "path.txt fehlt — Electron wird nachinstalliert"
            node node_modules/electron/install.js
          fi

          if [ ! -f node_modules/electron/path.txt ]; then
            echo "::error::Electron ließ sich nicht installieren"
            ls -la node_modules/electron/ || true
            exit 1
          fi

          echo "path.txt: $(cat node_modules/electron/path.txt)"

      - name: App bauen
        run: ${{ matrix.build_cmd }}

      # Windows und Linux erzeugen jeweils eine eigene Updater-Datei
      # (latest.yml / latest-linux.yml). Beide müssen ins Release.
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-${{ matrix.artifact }}
          # Nur die fertigen Pakete, nicht der entpackte Ordner:
          # der ist mehrere hundert MB groß und nutzt niemandem.
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # Die Android-App braucht eine ganz andere Werkzeugkette (JDK,
  # Android-SDK, Gradle) als die Electron-Ziele — deshalb ein eigener
  # Job statt eines dritten Matrix-Eintrags.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Android verlangt JDK 17; das mitgelieferte JDK 8 genügt nicht.
      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      # Stellt www/ zusammen und reicht die Versionsnummer aus der
      # package.json nach Android durch.
      - name: Web-Dateien vorbereiten
        run: npm run mobile:build

      - name: Android-Projekt erzeugen
        run: |
          # Das Projekt liegt nicht im Repo (Zwischenstände), also
          # bei jedem Lauf frisch anlegen.
          npx cap add android || echo "Projekt bestand bereits"
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Der Dateiname aus Gradle sagt nichts über die Version —
      # für das Release umbenennen.
      - name: APK benennen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist-android/Jellystream-${VERSION}.apk"
          ls -la dist-android/

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30

  # Hängt die Pakete aller Plattformen an das Release des Tags.
  # Existiert noch keines, wird es angelegt.
  release:
    # always(): ein gescheiterter Android-Build soll das Release für
    # Windows und Linux nicht verhindern. Fehlt latest.yml, bricht der
    # Job weiter unten trotzdem ab — die ist wirklich unverzichtbar.
    needs: [build, android]
    if: >-
      always() && (
        github.event_name == 'release' ||
        startsWith(github.ref, 'refs/tags/') ||
        inputs.tag != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      # download-artifact legt je Plattform einen Unterordner an.
      # Für den Release-Upload müssen alle Dateien flach nebeneinander
      # liegen, sonst landen Pfade statt Namen im Release.
      - name: Dateien zusammenlegen
        run: |
          mkdir -p release
          find artefakte -type f -exec cp {} release/ \;
          echo "Diese Dateien kommen ins Release:"
          ls -la release/

          # Ohne latest.yml findet der Updater keine Aktualisierung —
          # lieber hier abbrechen als ein unbrauchbares Release
          # veröffentlichen.
          if [ ! -f release/latest.yml ]; then
            echo "::error::latest.yml fehlt — der Windows-Build ist wohl fehlgeschlagen."
            exit 1
          fi

          # Die APK fehlt nur, wenn der Android-Job gescheitert ist.
          # Kein Abbruch: Windows und Linux sollen trotzdem erscheinen.
          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "::warning::Keine APK im Release — der Android-Job ist wohl fehlgeschlagen."
          fi

      - name: An das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: release/*
          draft: false
          # Bereits vorhandene gleichnamige Dateien werden ersetzt,
          # damit ein erneuter Lauf nicht scheitert.
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name != 'release' }}
