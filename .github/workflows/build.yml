name: Build

# Ein Befehl, ein vollständiges Release für alle Plattformen:
#
#   npm version minor && git push --follow-tags
#
# Actions baut daraufhin Windows und Linux, testet beides und hängt
# alle Pakete an ein Release — samt latest.yml, ohne die der Updater
# nichts findet.
#
# Wer lieber im Browser arbeitet: ein dort veröffentlichtes Release
# löst denselben Ablauf aus (release/published). Ein über die
# Weboberfläche angelegtes Release erzeugt KEIN push-Ereignis, deshalb
# sind beide Auslöser nötig.

on:
  release:
    types: [published]

  push:
    tags:
      # Beide Schreibweisen: bisherige Tags sind groß (V2.7.2),
      # `npm version` schreibt klein (v2.8.0).
      - "v*"
      - "V*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag, an dessen Release die Pakete gehängt werden (leer = nur Artefakte)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Ein fehlgeschlagenes Ziel soll das andere nicht abwürgen:
      # so sieht man, ob nur eine Plattform klemmt oder der Code.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build -- --linux AppImage deb
            artifact: linux
          - os: windows-latest
            build_cmd: npm run build -- --win nsis
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          # Beim manuellen Lauf mit Tag genau dessen Stand bauen,
          # sonst den auslösenden Commit.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Electron lädt seine Binärdatei per postinstall in einen Cache
      # außerhalb von node_modules. Wird node_modules aus dem Cache
      # wiederhergestellt, läuft postinstall nicht — die Binärdatei
      # fehlt dann und jeder Testaufruf bricht sofort ab.
      - name: Electron-Binärdatei sicherstellen
        run: node node_modules/electron/install.js

      # Die Testsuite öffnet echte Electron-Fenster. Auf den
      # Linux-Läufern gibt es keinen Bildschirm, deshalb xvfb.
      # Die Zusatzbibliotheken heißen je nach Ubuntu-Fassung anders
      # (libasound2 vs. libasound2t64), deshalb einzeln und ohne
      # Abbruch: xvfb allein ist das, was wirklich gebraucht wird.
      - name: Bildschirm für Tests bereitstellen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          for pkg in libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                     libgtk-3-0 libgbm1 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || echo "übersprungen: $pkg"
          done

      # Zeigt, ob Electron wirklich startet — und wenn nicht, WARUM.
      # ldd nennt fehlende Systembibliotheken beim Namen, statt sie
      # aus einem Testfehler erraten zu lassen.
      - name: Electron prüfen (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(node -p "require('electron')")
          echo "Binärdatei: $BIN"
          ls -la "$BIN" || { echo "::error::Binärdatei fehlt"; exit 1; }

          echo "--- fehlende Bibliotheken (falls welche) ---"
          ldd "$BIN" | grep "not found" || echo "keine"

          echo "--- Startversuch ---"
          xvfb-run --auto-servernum "$BIN" --version

      - name: Electron prüfen (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN=$(node -p "require('electron')")
          echo "Binärdatei: $BIN"
          "$BIN" --version

      # Ein einzelner npm-test-Aufruf verschluckt bei einem Fehlschlag,
      # WELCHER Schritt gescheitert ist. Deshalb nacheinander mit
      # sichtbarer Überschrift.
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          for t in workflow syntax downloads ui rows login playback i18n sync updater fixes smoke; do
            echo "::group::test:$t"
            xvfb-run --auto-servernum npm run "test:$t" || { echo "::error::test:$t fehlgeschlagen"; exit 1; }
            echo "::endgroup::"
          done

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for t in workflow syntax downloads ui rows login playback i18n sync updater fixes smoke; do
            echo "::group::test:$t"
            npm run "test:$t" || { echo "::error::test:$t fehlgeschlagen"; exit 1; }
            echo "::endgroup::"
          done

      - name: App bauen
        run: ${{ matrix.build_cmd }}

      # Windows und Linux erzeugen jeweils eine eigene Updater-Datei
      # (latest.yml / latest-linux.yml). Beide müssen ins Release.
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-${{ matrix.artifact }}
          # Nur die fertigen Pakete, nicht der entpackte Ordner:
          # der ist mehrere hundert MB groß und nutzt niemandem.
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # Hängt die Pakete beider Plattformen an das Release des Tags.
  # Existiert noch keines, wird es angelegt.
  release:
    needs: build
    # Läuft bei einem Tag-Push, einem veröffentlichten Release und
    # beim manuellen Lauf, sofern dort ein Tag angegeben wurde.
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      # download-artifact legt je Plattform einen Unterordner an.
      # Für den Release-Upload müssen alle Dateien flach nebeneinander
      # liegen, sonst landen Pfade statt Namen im Release.
      - name: Dateien zusammenlegen
        run: |
          mkdir -p release
          find artefakte -type f -exec cp {} release/ \;
          echo "Diese Dateien kommen ins Release:"
          ls -la release/

          # Ohne latest.yml findet der Updater keine Aktualisierung —
          # lieber hier abbrechen als ein unbrauchbares Release
          # veröffentlichen.
          if [ ! -f release/latest.yml ]; then
            echo "::error::latest.yml fehlt — der Windows-Build ist wohl fehlgeschlagen."
            exit 1
          fi

      - name: An das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: release/*
          draft: false
          # Bereits vorhandene gleichnamige Dateien werden ersetzt,
          # damit ein erneuter Lauf nicht scheitert.
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name != 'release' }}
