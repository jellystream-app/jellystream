name: Build

on:
  push:
    tags:
      - "V*"          # baut automatisch bei jedem Versions-Tag (z.B. v1.0.0)
  workflow_dispatch:  # zusätzlich manuell auslösbar über den Actions-Tab

# Ein laufender Build wird abgebrochen, wenn derselbe Tag erneut
# geschoben wird — spart Laufzeit bei Korrekturen.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Ein fehlgeschlagenes Ziel soll das andere nicht abwürgen:
      # so sieht man, ob nur Linux oder wirklich beides klemmt.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build -- --linux AppImage deb
            artifact: linux
          - os: windows-latest
            build_cmd: npm run build -- --win nsis
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Die Testsuite öffnet echte Electron-Fenster. Auf den
      # Linux-Läufern gibt es keinen Bildschirm, deshalb xvfb.
      # Die Zusatzbibliotheken heißen je nach Ubuntu-Fassung anders
      # (libasound2 vs. libasound2t64), deshalb einzeln und ohne
      # Abbruch: xvfb allein ist das, was wirklich gebraucht wird.
      - name: Bildschirm für Tests bereitstellen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          for pkg in libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                     libgtk-3-0 libgbm1 libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" || echo "übersprungen: $pkg"
          done

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

      - name: App bauen
        run: ${{ matrix.build_cmd }}
        env:
          # Ohne Token veröffentlicht electron-builder nichts —
          # das Hochladen übernimmt der Release-Schritt unten.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-${{ matrix.artifact }}
          # Nur die fertigen Pakete, nicht der entpackte Ordner:
          # der ist mehrere hundert MB groß und nutzt niemandem.
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # Bei einem Versions-Tag die Pakete an ein Release hängen.
  # latest.yml muss dabei sein, sonst findet der Updater nichts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Release anlegen oder ergänzen
        uses: softprops/action-gh-release@v2
        with:
          files: artefakte/**/*
          draft: false
          generate_release_notes: true
