name: Build

# Ein Befehl, ein vollständiges Release für alle Plattformen:
#
#   npm version minor && git push --follow-tags
#
# Actions baut daraufhin Windows und Linux und hängt alle Pakete an
# ein Release — samt latest.yml, ohne die der Updater nichts findet.
#
# Das `version`-Script in der package.json baut dabei web/ neu UND
# reicht die Nummer nach android/app/build.gradle durch. Letzteres
# fehlte bis 2.13.1: Die Datei ist versioniert und trägt versionCode
# und versionName, wurde aber nur beiläufig beim nächsten
# `mobile:build` angepasst. Blieb das aus, baute die APK mit der
# Nummer der Vorversion — und Android verweigert ein Update auf einen
# gleich hohen versionCode, also käme sie auf dem Telefon nie an.
#
# Wer lieber im Browser arbeitet: ein dort veröffentlichtes Release
# löst denselben Ablauf aus (release/published). Ein über die
# Weboberfläche angelegtes Release erzeugt KEIN push-Ereignis, deshalb
# sind beide Auslöser nötig.
#
# Die Testsuite läuft hier bewusst NICHT: sie fährt echte
# Electron-Fenster hoch, misst Layout und Zeitverhalten und ist auf
# CI-Läufern zu heikel — ein roter Lauf sagte dann mehr über den
# Läufer als über den Code. Getestet wird vor dem Tag, lokal mit
# `npm test`.

on:
  release:
    types: [published]

  push:
    tags:
      # Beide Schreibweisen: bisherige Tags sind groß (V2.7.2),
      # `npm version` schreibt klein (v2.8.0).
      - "v*"
      - "V*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag, an dessen Release die Pakete gehängt werden (leer = nur Artefakte)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Ein fehlgeschlagenes Ziel soll das andere nicht abwürgen:
      # so sieht man, ob nur eine Plattform klemmt oder der Code.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build -- --linux AppImage deb flatpak
            artifact: linux
          - os: windows-latest
            build_cmd: npm run build -- --win nsis
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          # Beim manuellen Lauf mit Tag genau dessen Stand bauen,
          # sonst den auslösenden Commit.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      # Node 22, weil @capacitor/cli nichts Älteres akzeptiert
      # (engines: >=22.0.0) und hart abbricht. Beide Jobs laufen
      # bewusst auf derselben Fassung — sonst baut CI gegen eine
      # andere Grundlage als der Android-Job.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # electron-builder packt die Electron-Binärdatei in das Paket.
      # Sie kommt per postinstall; der Schritt kann aber still
      # scheitern (Netz, Spiegelserver), und dann bricht erst der
      # Build ab. Deshalb vorher prüfen und notfalls nachholen.
      - name: Electron-Binärdatei sicherstellen
        shell: bash
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "path.txt fehlt — Electron wird nachinstalliert"
            node node_modules/electron/install.js
          fi

          if [ ! -f node_modules/electron/path.txt ]; then
            echo "::error::Electron ließ sich nicht installieren"
            ls -la node_modules/electron/ || true
            exit 1
          fi

          echo "path.txt: $(cat node_modules/electron/path.txt)"

      # Nur unter Linux nötig: electron-builder ruft für das
      # flatpak-Target extern `flatpak-builder` auf, das auf
      # ubuntu-latest nicht vorinstalliert ist. Windows braucht das
      # nie — daher an den os-Zweig der Matrix gebunden, statt einen
      # eigenen Job dafür anzulegen.
      - name: Flatpak-Werkzeuge einrichten
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

          # Laufzeit, SDK und Electron-BaseApp — alle drei in derselben
          # Fassung wie in package.json. Weichen sie voneinander ab,
          # bricht der Bau mitten im Zusammenpacken ab.
          #
          # Der Bundler würde Fehlendes zwar selbst nachladen
          # (auto-install-base), aber dann mitten im Bau; hier steht es
          # als eigener Schritt im Protokoll, wenn etwas klemmt.
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: App bauen
        run: ${{ matrix.build_cmd }}

      # Windows und Linux erzeugen jeweils eine eigene Updater-Datei
      # (latest.yml / latest-linux.yml). Beide müssen ins Release.
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-${{ matrix.artifact }}
          # Nur die fertigen Pakete, nicht der entpackte Ordner:
          # der ist mehrere hundert MB groß und nutzt niemandem.
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # Die Android-App braucht eine ganz andere Werkzeugkette (JDK,
  # Android-SDK, Gradle) als die Electron-Ziele — deshalb ein eigener
  # Job statt eines dritten Matrix-Eintrags.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      # Node 22: @capacitor/cli verlangt es (engines: >=22.0.0) und
      # bricht sonst mit "[fatal] The Capacitor CLI requires NodeJS
      # >=22.0.0" ab — erst beim `cap add` weiter unten, nicht schon
      # bei `npm ci`, denn ohne engine-strict warnt npm nur.
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # JDK 21, weil Capacitor 8 auf Java 21 übersetzt. Das steht nicht
      # zur Wahl: die Angabe wird von `cap sync` in
      # app/capacitor.build.gradle geschrieben ("DO NOT EDIT — GENERATED
      # EACH TIME") und steckt zusätzlich fest im Gradle-Modul
      # :capacitor-android unter node_modules. Eine eigene Angabe in
      # app/build.gradle griffe nur für :app und würde von der
      # erzeugten Datei ohnehin überschrieben.
      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      # Stellt www/ zusammen und reicht die Versionsnummer aus der
      # package.json nach Android durch.
      - name: Web-Dateien vorbereiten
        run: npm run mobile:build

      - name: Android-Projekt erzeugen
        run: |
          # Das Projekt liegt nicht im Repo (Zwischenstände), also
          # bei jedem Lauf frisch anlegen.
          npx cap add android || echo "Projekt bestand bereits"
          npx cap sync android

      # Der Signaturschlüssel liegt als base64 in den Secrets — eine
      # Datei lässt sich dort nicht ablegen. Fehlt das Secret, wird
      # unsigniert gebaut: der Lauf soll in einem Fork nicht scheitern.
      - name: Signaturschlüssel bereitstellen
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Alle vier Secrets gehören zusammen. Fehlt eines davon,
          # scheitert der Lauf sonst erst zehn Minuten später beim
          # Signieren — und die Meldung nennt dann nicht, welches.
          fehlend=""
          [ -z "$KEYSTORE_B64" ] && fehlend="$fehlend ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PW"  ] && fehlend="$fehlend ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS"    ] && fehlend="$fehlend ANDROID_KEY_ALIAS"
          [ -z "$KEY_PW"       ] && fehlend="$fehlend ANDROID_KEY_PASSWORD"

          if [ -n "$fehlend" ]; then
            echo "::warning::Secrets fehlen:$fehlend — die APK wird nicht signiert und ließe sich nicht installieren. Siehe docs/android-signierung.md"
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "fehlend=$fehlend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ein aus einer Datei kopiertes Secret trägt leicht Ballast
          # mit: Zeilenumbrüche, Leerzeichen — und ein BOM, das als
          # Zeichenfolge EF BB BF am Anfang steht und kein Leerraum
          # ist, also von `tr -d` allein nicht erwischt wird. Beides
          # entfernen, sonst liefert base64 -d stillen Unsinn.
          printf '%s' "$KEYSTORE_B64" \
            | sed '1s/^\xEF\xBB\xBF//' \
            | tr -d '\r\n \t' \
            | base64 -d > "$RUNNER_TEMP/release.jks"

          # Eine unbrauchbare Datei fiele sonst erst beim Signieren auf.
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Der entschlüsselte Schlüssel ist leer — ist das Secret vollständig kopiert?"
            exit 1
          fi

          # Passt das Passwort und gibt es den Alias überhaupt? Beides
          # hier prüfen, wo die Meldung noch eindeutig ist.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEYSTORE_PW" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Der Schlüssel lässt sich nicht öffnen — Passwort falsch oder Alias '$KEY_ALIAS' nicht enthalten. Siehe docs/android-signierung.md"
            exit 1
          fi

          echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
          echo "Schlüssel bereitgestellt ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes), Alias '$KEY_ALIAS' gefunden"

      # assembleRelease statt assembleDebug: Eine Debug-APK trägt das
      # Flag android:debuggable und ein Wegwerf-Zertifikat. Android
      # verweigert die Installation solcher Pakete.
      - name: APK bauen
        working-directory: android
        env:
          JELLYSTREAM_KEYSTORE: ${{ steps.keystore.outputs.vorhanden == 'ja' && format('{0}/release.jks', runner.temp) || '' }}
          JELLYSTREAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JELLYSTREAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JELLYSTREAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Der Dateiname aus Gradle sagt nichts über die Version —
      # für das Release umbenennen.
      - name: APK benennen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android

          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            # Ohne Schlüssel endet der Name auf -unsigned.
            APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi

          if [ ! -f "$APK" ]; then
            echo "::error::Keine APK gefunden."
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

          cp "$APK" "dist-android/Jellystream-${VERSION}.apk"
          ls -la dist-android/

      # Eine unsigniert oder mit Debug-Schlüssel gebaute APK sieht
      # fertig aus, lässt sich aber nicht installieren. Das hier
      # abfangen, nicht erst auf dem Telefon.
      - name: Signatur prüfen
        env:
          FEHLENDE_SECRETS: ${{ steps.keystore.outputs.fehlend }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="dist-android/Jellystream-${VERSION}.apk"

          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$SIGNER" ]; then
            echo "::warning::apksigner nicht gefunden — Signatur ungeprüft."
            exit 0
          fi

          echo "--- Signatur ---"
          if ! "$SIGNER" verify --print-certs "$APK" > signatur.txt 2>&1; then
            cat signatur.txt

            # Der häufigste Grund ist kein Fehler im Code, sondern ein
            # nicht hinterlegtes Secret. Dann hier auch sagen, welches.
            if [ -n "$FEHLENDE_SECRETS" ]; then
              echo "::error::Die APK ist unsigniert, weil diese Secrets fehlen:$FEHLENDE_SECRETS — anzulegen unter Settings → Secrets and variables → Actions. Anleitung: docs/android-signierung.md"
            else
              echo "::error::Die APK ist nicht gültig signiert und ließe sich nicht installieren."
            fi
            exit 1
          fi
          cat signatur.txt

          if grep -qi "CN=Android Debug" signatur.txt; then
            echo "::error::Signiert mit dem Debug-Schlüssel — Android lehnt die Installation ab."
            exit 1
          fi

          echo "OK: mit dem Release-Schlüssel signiert."

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: jellystream-android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30

  # Hängt die Pakete aller Plattformen an das Release des Tags.
  # Existiert noch keines, wird es angelegt.
  release:
    # always(): ein gescheiterter Android-Build soll das Release für
    # Windows und Linux nicht verhindern. Fehlt latest.yml, bricht der
    # Job weiter unten trotzdem ab — die ist wirklich unverzichtbar.
    needs: [build, android]
    if: >-
      always() && (
        github.event_name == 'release' ||
        startsWith(github.ref, 'refs/tags/') ||
        inputs.tag != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Artefakte einsammeln
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      # download-artifact legt je Plattform einen Unterordner an.
      # Für den Release-Upload müssen alle Dateien flach nebeneinander
      # liegen, sonst landen Pfade statt Namen im Release.
      - name: Dateien zusammenlegen
        run: |
          mkdir -p release
          find artefakte -type f -exec cp {} release/ \;
          echo "Diese Dateien kommen ins Release:"
          ls -la release/

          # Ohne latest.yml findet der Updater keine Aktualisierung —
          # lieber hier abbrechen als ein unbrauchbares Release
          # veröffentlichen.
          if [ ! -f release/latest.yml ]; then
            echo "::error::latest.yml fehlt — der Windows-Build ist wohl fehlgeschlagen."
            exit 1
          fi

          # Die APK fehlt nur, wenn der Android-Job gescheitert ist.
          # Kein Abbruch: Windows und Linux sollen trotzdem erscheinen.
          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "::warning::Keine APK im Release — der Android-Job ist wohl fehlgeschlagen."
          fi

      - name: An das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: release/*
          draft: false
          # Bereits vorhandene gleichnamige Dateien werden ersetzt,
          # damit ein erneuter Lauf nicht scheitert.
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name != 'release' }}