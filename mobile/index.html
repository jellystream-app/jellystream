<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: das Layout reicht bis unter die Notch,
         die sicheren Bereiche holt das CSS über env() zurück. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' http: https: data: blob:; media-src 'self' http: https: blob:; connect-src 'self' http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>Jellystream</title>
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <!-- ============================= LOGIN ============================= -->
    <div id="login-screen" class="m-login">
      <header class="m-login-head">
        <img class="m-logo" src="../build/icons/128x128.png" alt="Jellystream" width="56" height="56" />
        <span class="m-wordmark">Jellystream</span>
      </header>

      <div class="m-login-body">
        <h2 data-i18n="login.welcome">Willkommen zurück</h2>
        <p data-i18n="login.intro">Melde dich an deinem Server an, um fortzufahren.</p>

        <form id="connect-form" class="m-form" autocomplete="on">
          <label class="m-field">
            <span data-i18n="login.server">Server</span>
            <input id="server-url" type="url" inputmode="url" value="http://192.168.1.50:8096"
                   placeholder="http://192.168.1.50:8096" spellcheck="false" required />
          </label>

          <label class="m-field">
            <span data-i18n="login.username">Benutzername</span>
            <input id="username" type="text" autocomplete="username"
                   data-i18n-placeholder="login.usernamePlaceholder" placeholder="Benutzername" required />
          </label>

          <label class="m-field">
            <span data-i18n="login.password">Passwort</span>
            <input id="password" type="password" autocomplete="current-password"
                   data-i18n-placeholder="login.passwordPlaceholder" placeholder="Passwort" />
          </label>

          <div id="auth-error" class="m-error" aria-live="polite"></div>

          <button type="submit" id="login-btn" class="m-btn primary">
            <span data-i18n="login.submit">Anmelden</span>
          </button>
        </form>
      </div>

      <footer class="m-login-foot">
        <span id="login-version"></span>
      </footer>
    </div>

    <!-- ============================== APP ============================== -->
    <div id="app-shell" class="m-app hidden">
      <!-- Kopfzeile: Titel und Suche -->
      <header class="m-topbar" id="m-topbar">
        <button id="m-back" class="m-icon-btn hidden" type="button" data-i18n-aria="nav.back" aria-label="Zurück">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 id="m-title">Jellystream</h1>
        <button id="m-search-btn" class="m-icon-btn" type="button" data-i18n-aria="nav.search" aria-label="Suchen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="m-settings-btn" class="m-icon-btn" type="button" data-i18n-aria="settings.title" aria-label="Einstellungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </header>

      <!-- Suchfeld, klappt unter der Kopfzeile auf -->
      <div id="m-search-bar" class="m-search-bar hidden">
        <input id="m-search-input" type="search" inputmode="search"
               data-i18n-placeholder="nav.searchPlaceholder" placeholder="Suchen…" />
        <button id="m-search-close" class="m-icon-btn" type="button" data-i18n-aria="common.close" aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <main id="m-view" class="m-view"></main>

      <!-- Navigation unten: mit dem Daumen erreichbar -->
      <nav class="m-tabs" id="m-tabs">
        <button class="m-tab active" type="button" data-view="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.home">Startseite</span>
        </button>
        <button class="m-tab" type="button" data-view="movies">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor"/></svg>
          <span data-i18n="nav.movies">Filme</span>
        </button>
        <button class="m-tab" type="button" data-view="series">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m8 4 4 3 4-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span data-i18n="nav.series">Serien</span>
        </button>
        <button class="m-tab" type="button" data-view="music">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
          <span data-i18n="nav.music">Musik</span>
        </button>
        <button class="m-tab" type="button" data-view="offline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M8 10.5 12 14.5l4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v1.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span data-i18n="nav.offline">Offline</span>
        </button>
      </nav>
    </div>

    <!-- ============================ PLAYER ============================ -->
    <div id="m-player" class="m-player hidden">
      <video id="m-video" playsinline webkit-playsinline></video>

      <div id="m-player-ui" class="m-player-ui">
        <div class="m-player-top">
          <button id="m-player-close" class="m-icon-btn light" type="button"
                  data-i18n-aria="player.close" aria-label="Schließen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="m-player-titles">
            <strong id="m-player-title"></strong>
            <span id="m-player-sub"></span>
          </div>
          <span id="m-player-method" class="m-method"></span>
        </div>

        <div class="m-player-center">
          <button id="m-back10" class="m-round-btn" type="button" data-i18n-aria="shortcuts.back10" aria-label="Zurück">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9l5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9h7a5 5 0 1 1 0 10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="m-play" class="m-round-btn big" type="button" data-i18n-aria="player.playPause" aria-label="Abspielen">
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
            <svg class="ic-pause hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
          </button>
          <button id="m-fwd10" class="m-round-btn" type="button" data-i18n-aria="shortcuts.forward10" aria-label="Vor">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5 5 4-5 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 9h-7a5 5 0 1 0 0 10h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="m-player-bottom">
          <div class="m-times">
            <span id="m-current">0:00</span>
            <span id="m-duration">0:00</span>
          </div>
          <input id="m-seek" class="m-seek" type="range" min="0" max="1000" value="0"
                 data-i18n-aria="player.play" aria-label="Position" />
          <div class="m-player-actions">
            <button id="m-subs" class="m-text-btn hidden" type="button" data-i18n="player.subtitleTrack">Untertitel</button>
            <button id="m-audio" class="m-text-btn hidden" type="button" data-i18n="player.audioTrack">Tonspur</button>
          </div>
        </div>
      </div>

      <div id="m-player-loading" class="m-player-loading"><div class="m-spinner"></div></div>
      <div id="m-player-error" class="m-player-error hidden" role="alert"></div>
    </div>

    <!-- Auswahl für Ton- und Untertitelspuren -->
    <div id="m-sheet" class="m-sheet hidden">
      <div class="m-sheet-card">
        <div class="m-sheet-handle"></div>
        <h3 id="m-sheet-title"></h3>
        <div id="m-sheet-options" class="m-sheet-options"></div>
      </div>
    </div>

    <!-- Einstellungen als Vollbildseite -->
    <div id="m-settings" class="m-settings hidden">
      <header class="m-topbar">
        <button id="m-settings-close" class="m-icon-btn" type="button" data-i18n-aria="common.close" aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 data-i18n="settings.title">Einstellungen</h1>
      </header>
      <div id="m-settings-body" class="m-settings-body"></div>
    </div>

    <div id="m-toast" class="m-toast hidden"></div>

    <!-- Kern zuerst: die Oberfläche baut darauf auf -->
    <script src="../core/api.js"></script>
    <script src="../core/i18n.js"></script>
    <script src="../core/playback.js"></script>
    <script src="../i18n-dom.js"></script>
    <script src="mobile.js"></script>
    <script src="player.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
